  <!-- stem nodes -->
  <g>
    <circle cx="195" cy="183" r="3.6" fill="#2f6b4f"/>
    <circle cx="210" cy="165" r="3.6" fill="#2f6b4f"/>
    <circle cx="228" cy="147" r="3.6" fill="#2f6b4f"/>
    <circle cx="246" cy="131" r="3.6" fill="#b8934a"/>
    <circle cx="266" cy="117" r="3.6" fill="#b8934a"/>
    <circle cx="286" cy="105" r="3.6" fill="#b8934a"/>
    <circle cx="306" cy="96"  r="3.6" fill="#b8934a"/>
    <circle cx="320" cy="89"  r="4.2" fill="#b8934a"/>
    <circle cx="336" cy="96"  r="3.6" fill="#c0392b"/>
    <circle cx="356" cy="107" r="3.6" fill="#c0392b"/>
    <circle cx="376" cy="121" r="3.6" fill="#c0392b"/>
    <circle cx="396" cy="138" r="3.6" fill="#4a4a4a"/>
    <circle cx="414" cy="154" r="3.6" fill="#4a4a4a"/>
    <circle cx="432" cy="173" r="3.6" fill="#4a4a4a"/>
