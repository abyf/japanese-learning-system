  <text x="320" y="312" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="60" letter-spacing="2">
    <tspan fill="#3f3f3f">NIP</tspan><tspan fill="#b8934a">PON</tspan><tspan fill="#3f3f3f">MBOA</tspan>
  </text>
  <text x="322" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="24" letter-spacing="9" fill="#b8934a">CONSULTING</text>
</svg>
