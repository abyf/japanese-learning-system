    <line x1="376" y1="175" x2="376" y2="121" stroke="#c0392b" stroke-width="2"/>
    <line x1="396" y1="184" x2="396" y2="138" stroke="#4a4a4a" stroke-width="2"/>
    <line x1="414" y1="194" x2="414" y2="154" stroke="#4a4a4a" stroke-width="2"/>
